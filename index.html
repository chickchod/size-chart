<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아동복 사이즈 추천</title>
<style>
  :root {
    --bg: #f7f4ef; --card: #ffffff; --ink: #3a332c; --muted: #8a8077;
    --line: #e7e1d8; --accent: #b98b73; --accent-soft: #f3e6dd;
    --ok: #5f8a6b; --warn: #b9813a; --bad: #b55a4a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 20px; }

  .panel {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 18px; display: grid; gap: 14px;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); align-items: end;
    position: sticky; top: 8px; z-index: 5; box-shadow: 0 4px 16px rgba(0,0,0,.04);
  }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  input, select {
    width: 100%; padding: 10px 12px; font-size: 16px; border: 1px solid var(--line);
    border-radius: 10px; background: #fff; color: var(--ink);
  }
  input:focus, select:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg button {
    flex: 1; padding: 10px 6px; border: 0; background: #fff; font-size: 14px; color: var(--ink); cursor: pointer;
  }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--accent); color: #fff; }

  .summary { margin: 18px 2px 10px; font-size: 14px; color: var(--muted); min-height: 21px; }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .brand { font-weight: 700; font-size: 16px; }
  .line-tag { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
  .result { margin: 12px 0 6px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .big { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
  .alt { font-size: 14px; color: var(--muted); }
  .alt b { color: var(--ink); }
  .why { font-size: 13px; color: var(--muted); margin: 0 0 10px; }
  .badge { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 6px; margin: 0 4px 4px 0; }
  .b-warn { background: #fbf0e0; color: var(--warn); }
  .b-bad { background: #f8e5e1; color: var(--bad); }
  .b-ok { background: #e7f0e9; color: var(--ok); }
  .placeholder { color: var(--muted); font-size: 14px; margin: 12px 0; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 6px; }
  th, td { text-align: center; padding: 6px 4px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; }
  tr.pick td { background: var(--accent-soft); font-weight: 700; }
  tr.pick2 td { background: #faf5f1; }
  .note { font-size: 12px; color: var(--muted); margin-top: 8px; }
  footer { margin-top: 28px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <h1>아동복 브랜드별 사이즈 추천</h1>
  <p class="sub">아이의 키와 몸무게를 넣으면 브랜드마다 맞는 사이즈를 알려드려요.</p>

  <div class="panel">
    <div>
      <label for="h">키 (cm)</label>
      <input id="h" type="number" inputmode="decimal" placeholder="예: 92" min="40" max="160" step="0.1">
    </div>
    <div>
      <label for="w">몸무게 (kg)</label>
      <input id="w" type="number" inputmode="decimal" placeholder="예: 13" min="2" max="50" step="0.1">
    </div>
    <div>
      <label>종류</label>
      <div class="seg" id="cat">
        <button data-v="top" class="on">상의</button>
        <button data-v="bottom">하의</button>
        <button data-v="outer">아우터</button>
      </div>
    </div>
    <div>
      <label>라인</label>
      <div class="seg" id="lineFilter">
        <button data-v="all" class="on">전체</button>
        <button data-v="baby">베이비</button>
        <button data-v="kids">키즈</button>
      </div>
    </div>
    <div>
      <label for="brandSel">브랜드</label>
      <select id="brandSel"><option value="">전체 브랜드</option></select>
    </div>
  </div>

  <div class="summary" id="summary"></div>
  <div class="grid" id="grid"></div>

  <footer>
    평균적인 사이즈표 기준이며 아이의 체형이나 디자인의 핏감에 따라 차이가 있을 수 있어요.
    추천 사이즈가 경계에 걸리면 한 사이즈 크게 고르시는 걸 권해요.
  </footer>
</div>

  ]},
];

const state = { cat: 'top', line: 'all', brand: '' };
const $ = (id) => document.getElementById(id);

function fmtRange(r, unit) {
  if (!r) return '-';
  const [a, b] = r;
  if (a == null && b == null) return '-';
  if (a == null) return `~${b}${unit}`;
  if (b == null) return `${a}${unit}~`;
  return `${a}~${b}${unit}`;
}

/*
  추천 방식: 키·몸무게 각각 "이 값을 넘지 않는 가장 작은 사이즈"를 찾고,
  둘 중 더 큰 사이즈를 기본 추천으로 고릅니다. (아이 옷은 작은 것보다 큰 게 안전)
*/
function fitIndex(sizes, key, value) {
  if (value == null || sizes.every((s) => !s[key])) return null;
  for (let i = 0; i < sizes.length; i++) {
    const r = sizes[i][key];
    if (r && r[1] != null && value <= r[1]) return i;
  }
  return sizes.length; // 모든 사이즈 초과
}

function recommend(chart, h, w, cat) {
  const sizes = chart.sizes;
  const hi = fitIndex(sizes, 'h', h);
  const wi = fitIndex(sizes, 'w', w);
  if (hi == null && wi == null) return { none: true };

  const flags = [];
  let idx = Math.max(hi ?? -1, wi ?? -1);
  let over = false;
  if (idx >= sizes.length) { over = true; idx = sizes.length - 1; }

  const s = sizes[idx];
  const why = [];
  if (hi != null) why.push(`키 ${h}cm → ${hi >= sizes.length ? '최대 사이즈 초과' : sizes[hi].label}`);
  if (wi != null) why.push(`몸무게 ${w}kg → ${wi >= sizes.length ? '최대 사이즈 초과' : sizes[wi].label}`);

  if (over) flags.push(['b-bad', '이 라인의 가장 큰 사이즈보다 커요']);
  if (hi != null && wi != null && hi !== wi && hi < sizes.length && wi < sizes.length) {
    flags.push(['b-warn', '키와 몸무게 기준이 달라 큰 쪽으로 추천했어요']);
  }
  const first = sizes[0];
  if (!over && idx === 0 && h != null && first.h && first.h[0] != null && h < first.h[0] - 3) {
    flags.push(['b-warn', '가장 작은 사이즈도 클 수 있어요']);
  }

  // 경계값: 상한까지 남은 여유가 적으면 한 사이즈 업 제안
  let tight = false;
  if (!over) {
    if (h != null && s.h && s.h[1] != null && s.h[1] - h <= 2) tight = true;
    if (w != null && s.w && s.w[1] != null && s.w[1] - w <= 0.5) tight = true;
  }
  let up = null;
  if (!over && idx + 1 < sizes.length && (tight || cat === 'outer')) {
    up = idx + 1;
    flags.push(['b-ok', cat === 'outer' && !tight ? '아우터는 한 사이즈 크게도 추천해요' : '상한에 가까워요 · 여유 있게 입히려면 한 사이즈 업']);
  }
  return { idx, up, over, flags, why: why.join(' · ') };
}

function rowHtml(s, i, rec) {
  const cls = rec && i === rec.idx ? 'pick' : rec && i === rec.up ? 'pick2' : '';
  return `<tr class="${cls}">
    <td>${s.label}${s.alt ? `<br><span style="font-weight:400;color:var(--muted)">${s.alt}</span>` : ''}</td>
    <td>${fmtRange(s.h, '')}</td><td>${fmtRange(s.w, '')}</td><td>${s.age || '-'}</td></tr>`;
}

function render() {
  const hRaw = $('h').value.trim(), wRaw = $('w').value.trim();
  const h = hRaw === '' ? null : parseFloat(hRaw);
  const w = wRaw === '' ? null : parseFloat(wRaw);
  const hasInput = h != null || w != null;

  const charts = BRANDS.filter((c) =>
    (state.line === 'all' || c.line === state.line) && (!state.brand || c.brand === state.brand));

  const catName = { top: '상의', bottom: '하의', outer: '아우터' }[state.cat];
  $('summary').textContent = hasInput
    ? `${[h != null ? `키 ${h}cm` : '', w != null ? `몸무게 ${w}kg` : ''].filter(Boolean).join(', ')} · ${catName} 기준 추천`
    : '키나 몸무게를 입력하면 추천 사이즈가 표시돼요. (둘 다 넣으면 더 정확해요)';

  $('grid').innerHTML = charts.map((c) => {
    const rec = hasInput ? recommend(c, h, w, state.cat) : null;
    let resultHtml;
    if (!hasInput) {
      resultHtml = `<p class="placeholder">입력 대기 중</p>`;
    } else if (rec.none) {
      resultHtml = `<p class="placeholder">이 브랜드 표에는 입력한 항목 기준 정보가 없어요. ${c.sizes[0].h ? '키' : '몸무게'}를 입력해 주세요.</p>`;
    } else {
      const s = c.sizes[rec.idx];
      const upS = rec.up != null ? c.sizes[rec.up] : null;
      resultHtml = `
        <div class="result">
          <span class="big">${s.label}</span>
          ${s.alt ? `<span class="alt">${s.alt}</span>` : ''}
          ${upS ? `<span class="alt">여유 추천 <b>${upS.label}</b></span>` : ''}
        </div>
        <p class="why">${rec.why}</p>
        <div>${rec.flags.map(([k, t]) => `<span class="badge ${k}">${t}</span>`).join('')}</div>`;
    }
    return `<article class="card">
      <div class="card-head"><span class="brand">${c.brand}</span><span class="line-tag">${c.title}</span></div>
      ${resultHtml}
      <table><thead><tr><th>사이즈</th><th>키(cm)</th><th>몸무게(kg)</th><th>연령</th></tr></thead>
      <tbody>${c.sizes.map((s, i) => rowHtml(s, i, rec && !rec.none ? rec : null)).join('')}</tbody></table>
      ${c.note ? `<p class="note">${c.note}</p>` : ''}
    </article>`;
  }).join('');
}

function bindSeg(id, key) {
  $(id).addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    [...$(id).children].forEach((x) => x.classList.toggle('on', x === b));
    state[key] = b.dataset.v; render();
  });
}

[...new Set(BRANDS.map((c) => c.brand))].forEach((name) => {
  const o = document.createElement('option'); o.value = name; o.textContent = name; $('brandSel').appendChild(o);
});
$('brandSel').addEventListener('change', (e) => { state.brand = e.target.value; render(); });
$('h').addEventListener('input', render);
$('w').addEventListener('input', render);
bindSeg('cat', 'cat');
bindSeg('lineFilter', 'line');
render();
</script>
</body>
</html>

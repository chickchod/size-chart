<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사이즈 가이드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f9f7f3; color: #3b302b;
    font-family: "Pretendard", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  main { width: 100%; max-width: 520px; padding: 24px 16px; text-align: center; }
  h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 20px; }
  .shops { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
  a {
    display: block; padding: 28px 12px; border-radius: 22px; text-decoration: none; font-weight: 800; font-size: 18px;
  }
  .p { background: #f7e3df; color: #b9726c; }
  .o { background: #e4e9da; color: #6f8060; }
  a span { display: block; font-size: 13px; font-weight: 500; margin-top: 4px; opacity: .8; }
</style>
</head>
<body>
<main>
  <h1>사이즈 가이드</h1>
  <div class="shops">
    <a class="p" href="pingdora/">핑도라<span>사이즈 찾기</span></a>
    <a class="o" href="otree/">오트리<span>사이즈 찾기</span></a>
  </div>
</main>
</body>
</html>

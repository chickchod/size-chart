<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오트리 사이즈 가이드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  /* 테마 색상 */
  :root {
    --bg: #f7f5ef; --paper: #ffffff; --ink: #34362d; --muted: #8f8f80; --line: #e6e4d8;
    --c1: #a9b79a; --c2: #e4e9da; --c3: #f2f4ec; --deep: #6f8060;
    --ok: #6f9a7c; --warn: #c48a3f; --bad: #c0675c;
    --radius: 22px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Pretendard", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    line-height: 1.5; -webkit-font-smoothing: antialiased; transition: background .3s;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 20px 16px 72px; }

  /* 헤더 */
  .hero { position: relative; text-align: center; padding: 36px 8px 28px; }
  .hero .shopname { font-size: 15px; font-weight: 700; color: var(--deep); letter-spacing: .02em; }
  .hero h1 { font-size: clamp(26px, 5vw, 36px); font-weight: 800; letter-spacing: -0.03em; margin: 6px 0 8px; }
  .hero p { margin: 0; color: var(--muted); font-size: 15px; }
  .deco { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .deco span { position: absolute; border-radius: 50%; background: var(--c2); opacity: .7; }

  /* 입력 카드 */
  .form {
    background: var(--paper); border-radius: var(--radius); padding: 22px;
    box-shadow: 0 10px 30px -18px rgba(80, 50, 40, .25); border: 1px solid var(--line);
    display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  }
  .form > div { min-width: 0; }
  .field-label { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 8px; display: block; }
  .stepper {
    display: flex; align-items: center; background: var(--c3); border-radius: 16px; padding: 6px;
  }
  .stepper button {
    width: 40px; height: 40px; flex: none; border: 0; border-radius: 12px; background: var(--paper);
    color: var(--deep); font-size: 20px; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.06);
  }
  .stepper button:active { transform: scale(.94); }
  .stepper input {
    flex: 1; min-width: 0; border: 0; background: transparent; text-align: center; font: inherit;
    font-size: 24px; font-weight: 800; color: var(--ink); outline: none; -moz-appearance: textfield;
  }
  .stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .stepper input::placeholder { color: #cfc4bd; font-weight: 600; }
  .unit { font-size: 14px; color: var(--muted); padding-right: 8px; }
  .full { grid-column: 1 / -1; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 99px;
    padding: 8px 16px; font: inherit; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    transition: all .15s;
  }
  .chip svg { width: 18px; height: 18px; }
  .chip.on { background: var(--c2); border-color: var(--c1); color: var(--deep); font-weight: 700; }
  .brand-chips { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .brand-chips::-webkit-scrollbar { display: none; }
  .brand-chips .chip { white-space: nowrap; }

  /* 결과 */
  .status { text-align: center; color: var(--muted); font-size: 14px; margin: 26px 0 14px; }
  .status b { color: var(--deep); }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); }
  .card {
    background: var(--paper); border-radius: var(--radius); padding: 18px; border: 1px solid var(--line);
    display: flex; flex-direction: column; gap: 12px; animation: up .35s ease both;
  }
  @keyframes up { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .card-top { display: flex; align-items: center; gap: 14px; }
  .bubble {
    width: 72px; height: 72px; flex: none; border-radius: 50%; background: var(--c1); color: #fff;
    display: grid; place-items: center; font-weight: 800; font-size: 22px; letter-spacing: -0.02em;
    box-shadow: inset 0 -4px 0 rgba(0,0,0,.06);
  }
  .bubble.none { background: var(--c3); color: var(--muted); font-size: 13px; font-weight: 600; }
  .bubble.small { font-size: 18px; }
  .bubble.over { background: var(--c3); color: var(--deep); box-shadow: inset 0 0 0 2px var(--c2); }
  .brand { font-weight: 800; font-size: 17px; letter-spacing: -0.01em; }
  .tag { display: inline-block; font-size: 12px; color: var(--deep); background: var(--c3); border-radius: 99px; padding: 2px 10px; margin-top: 4px; }
  .alt { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .alt b { color: var(--deep); }
  .why { font-size: 13px; color: var(--muted); background: var(--bg); border-radius: 12px; padding: 8px 12px; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; }
  .badge { font-size: 12px; padding: 3px 10px; border-radius: 99px; }
  .b-warn { background: #fbf1e3; color: var(--warn); }
  .b-bad { background: #f9e7e3; color: var(--bad); }
  .b-ok { background: #e9f2ea; color: var(--ok); }

  details { border-top: 1px dashed var(--line); padding-top: 10px; }
  summary { cursor: pointer; font-size: 13px; color: var(--muted); list-style: none; display: flex; justify-content: space-between; }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "+"; font-size: 16px; line-height: 1; }
  details[open] summary::after { content: "–"; }
  table { width: 100%; border-collapse: separate; border-spacing: 0 4px; font-size: 13px; margin-top: 8px; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; padding: 4px; }
  td { text-align: center; padding: 7px 4px; background: var(--bg); }
  td:first-child { border-radius: 10px 0 0 10px; font-weight: 700; }
  td:last-child { border-radius: 0 10px 10px 0; }
  td small { display: block; font-weight: 400; color: var(--muted); font-size: 11px; }
  tr.pick td { background: var(--c2); color: var(--deep); font-weight: 700; }
  tr.pick2 td { background: var(--c3); }
  .note { font-size: 12px; color: var(--muted); margin: 8px 0 0; }

  .empty { grid-column: 1 / -1; text-align: center; padding: 30px 0 10px; color: var(--muted); font-size: 14px; }
  .empty svg { width: 120px; height: auto; display: block; margin: 0 auto 10px; }

  footer { margin-top: 36px; text-align: center; font-size: 12px; color: var(--muted); line-height: 1.7; }

  /* 이미지 저장 */
  .save { margin-top: 10px; font-size: 13px; padding: 6px 14px; }
  .status .save { display: inline-flex; margin-top: 12px; }
  .imgview {
    position: fixed; inset: 0; z-index: 50; background: rgba(40, 30, 25, .55);
    display: grid; place-items: center; padding: 16px;
  }
  .imgview[hidden] { display: none; }
  .imgview-box {
    background: var(--paper); border-radius: var(--radius); padding: 16px; width: 100%; max-width: 480px;
    max-height: 100%; overflow: auto; text-align: center;
  }
  .imgview img { width: 100%; height: auto; display: block; border-radius: 12px; border: 1px solid var(--line); }
  .imgview p { font-size: 13px; color: var(--muted); margin: 10px 0; }
  .imgview-btns { display: flex; gap: 8px; justify-content: center; }
  .imgview-btns .chip { text-decoration: none; }

  @media (max-width: 560px) {
    .form { grid-template-columns: minmax(0, 1fr); padding: 18px; }
    .grid { grid-template-columns: 1fr; }
    .hero { padding: 26px 4px 20px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="deco" aria-hidden="true">
      <span style="width:90px;height:90px;left:4%;top:18px"></span>

  <section class="form">
    <div>
      <span class="field-label">키</span>
      <div class="stepper">
        <button type="button" data-step="h" data-d="-1" aria-label="키 줄이기">−</button>
        <input id="h" type="number" inputmode="decimal" placeholder="90" min="40" max="160" step="0.1" aria-label="키 (cm)">
        <span class="unit">cm</span>
        <button type="button" data-step="h" data-d="1" aria-label="키 늘리기">+</button>
      </div>
    </div>
    <div>
      <span class="field-label">몸무게</span>
      <div class="stepper">
        <button type="button" data-step="w" data-d="-0.5" aria-label="몸무게 줄이기">−</button>
        <input id="w" type="number" inputmode="decimal" placeholder="13" min="2" max="50" step="0.1" aria-label="몸무게 (kg)">
        <span class="unit">kg</span>
        <button type="button" data-step="w" data-d="0.5" aria-label="몸무게 늘리기">+</button>
      </div>
    </div>
    <div>
      <span class="field-label">어떤 옷인가요?</span>
      <div class="chips" id="cat">
        <button class="chip on" data-v="top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M8 3 3 6l2 4 2-1v12h10V9l2 1 2-4-5-3c0 1.7-1.8 3-4 3S8 4.7 8 3Z"/></svg>상의</button>
        <button class="chip" data-v="bottom"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M6 3h12l1 18h-5l-2-11-2 11H5L6 3Z"/></svg>하의</button>
        <button class="chip" data-v="outer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M9 3 4 6 2 13l3 1v7h14v-7l3-1-2-7-5-3-3 4-3-4Z"/><path d="M12 7v14"/></svg>아우터</button>
      </div>
    </div>
    <div>
      <span class="field-label">라인</span>
      <div class="chips" id="lineFilter">
        <button class="chip on" data-v="all">전체</button>
        <button class="chip" data-v="baby">베이비</button>
        <button class="chip" data-v="kids">키즈</button>
      </div>
    </div>
    <div class="full">
      <span class="field-label">브랜드</span>
      <div class="chips brand-chips" id="brandChips"></div>
    </div>
  </section>

  <div class="status" id="status"></div>
  <div class="grid" id="grid"></div>

  <footer>
    평균적인 사이즈표 기준이며 아이의 체형이나 디자인의 핏감에 따라 차이가 있을 수 있어요.<br>
    여유 있게 입히고 싶다면 한 사이즈 크게 골라주세요.
  </footer>
</div>

<div class="imgview" id="imgview" hidden>
  <div class="imgview-box">
    <div class="imgview-btns">
      <a class="chip on" id="imgviewDl" download>이미지 다운로드</a>
      <button type="button" class="chip" id="imgviewClose">닫기</button>
    </div>
    <p>이미지를 길게 눌러서 저장할 수도 있어요</p>
    <img id="imgviewImg" alt="">
  </div>
</div>

function fmtRange(r) {
  if (!r) return '-';
  const [a, b] = r;
  if (a == null && b == null) return '-';
  if (a == null) return `~${b}`;
  if (b == null) return `${a}~`;
  return `${a}~${b}`;
}

/*
  추천 방식: 키·몸무게 각각 "이 값을 넘지 않는 가장 작은 사이즈"를 찾고,
  둘 중 더 큰 사이즈를 기본 추천으로 고릅니다. (아이 옷은 작은 것보다 큰 게 안전)
*/
function fitIndex(sizes, key, value) {
  if (value == null || sizes.every((s) => !s[key])) return null;
  for (let i = 0; i < sizes.length; i++) {
    const r = sizes[i][key];
    if (r && r[1] != null && value <= r[1]) return i;
  }
  return sizes.length; // 모든 사이즈 초과
}

function recommend(chart, h, w, cat) {
  const sizes = chart.sizes;
  const hi = fitIndex(sizes, 'h', h);
  const wi = fitIndex(sizes, 'w', w);
  if (hi == null && wi == null) return { none: true };

  const flags = [];
  let idx = Math.max(hi ?? -1, wi ?? -1);
  let over = false;
  if (idx >= sizes.length) { over = true; idx = sizes.length - 1; }

  const s = sizes[idx];
  const why = [];
  if (hi != null) why.push(`키 ${h}cm → ${hi >= sizes.length ? '최대 사이즈 초과' : sizes[hi].label}`);
  if (wi != null) why.push(`몸무게 ${w}kg → ${wi >= sizes.length ? '최대 사이즈 초과' : sizes[wi].label}`);

  if (over) flags.push(['b-bad', '가장 큰 사이즈보다 커요']);
  if (hi != null && wi != null && hi !== wi && hi < sizes.length && wi < sizes.length) {
    flags.push(['b-warn', '키·몸무게 중 큰 쪽 기준']);
  }
  const first = sizes[0];
  if (!over && idx === 0 && h != null && first.h && first.h[0] != null && h < first.h[0] - 3) {
    flags.push(['b-warn', '가장 작은 사이즈도 클 수 있어요']);
  }

  // 경계값: 상한까지 남은 여유가 적으면 한 사이즈 업 제안
  let tight = false;
  if (!over) {
    if (h != null && s.h && s.h[1] != null && s.h[1] - h <= 2) tight = true;
    if (w != null && s.w && s.w[1] != null && s.w[1] - w <= 0.5) tight = true;
  }
  let up = null;
  if (!over && idx + 1 < sizes.length && (tight || cat === 'outer')) {
    up = idx + 1;
    flags.push(['b-ok', cat === 'outer' && !tight ? '아우터는 한 사이즈 업도 좋아요' : '상한에 가까워요 · 한 사이즈 업 추천']);
  }
  return { idx, up, over, flags, why: why.join(' · ') };
}

/*
  이미지(PNG) 저장
  - 화면을 캡처하지 않고 캔버스에 직접 그려요 (외부 라이브러리 없이 동작)
  - 먼저 위치를 계산하면서 그리기 작업(ops)을 모아두고, 전체 높이가 정해지면 한 번에 그립니다
*/
const FONT = '"Pretendard", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
const MEASURE = document.createElement('canvas').getContext('2d');
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const BADGE_COLORS = { 'b-warn': ['#fbf1e3', '--warn'], 'b-bad': ['#f9e7e3', '--bad'], 'b-ok': ['#e9f2ea', '--ok'] };

function setFont(ctx, size, weight) { ctx.font = `${weight} ${size}px ${FONT}`; }
function textWidth(text, size, weight) { setFont(MEASURE, size, weight); return MEASURE.measureText(text).width; }

function wrapText(text, size, weight, maxW) {
  setFont(MEASURE, size, weight);
  const fits = (t) => MEASURE.measureText(t).width <= maxW;
  const lines = [];
  let line = '';
  for (const word of String(text).split(' ')) {
    const t = line ? `${line} ${word}` : word;
    if (fits(t)) { line = t; continue; }
    if (line) lines.push(line);
    line = '';
    for (const ch of word) { // 한 줄에 안 들어가는 긴 단어는 글자 단위로 자르기
      if (line && !fits(line + ch)) { lines.push(line); line = ''; }
      line += ch;
    }
  }
  if (line) lines.push(line);
  return lines;
}

function newSheet() {
  const ops = [];
  return {
    // maxW를 넘으면 글자 크기를 줄여서 맞춤
    text(str, x, y, size, weight, color, align = 'left', maxW = 0) {
      ops.push((ctx) => {
        let s = size;
        setFont(ctx, s, weight);
        while (maxW && s > 9 && ctx.measureText(str).width > maxW) setFont(ctx, --s, weight);
        ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'middle';
        ctx.fillText(str, x, y);
      });
    },
    box(x, y, w, h, r, fill, stroke) {
      ops.push((ctx) => {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
        if (fill) { ctx.fillStyle = fill; ctx.fill(); }
        if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke(); }
      });
    },
    circle(cx, cy, r, fill, ring) {
      ops.push((ctx) => {
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fillStyle = fill; ctx.fill();
        if (ring) { ctx.beginPath(); ctx.arc(cx, cy, r - 1, 0, Math.PI * 2); ctx.strokeStyle = ring; ctx.lineWidth = 2; ctx.stroke(); }
      });
    },
    pill(str, x, y, size, fg, bg) { // y = 위쪽, 반환값 = 너비
      const w = textWidth(str, size, 500) + 20;
      this.box(x, y, w, size + 10, (size + 10) / 2, bg);
      this.text(str, x + 10, y + (size + 10) / 2, size, 500, fg);
      return w;
    },
    // 나중에 높이가 정해진 뒤 채울 자리 (카드 배경 등)
    slot() { const i = ops.length; ops.push(() => {}); return (fn) => { ops[i] = fn; }; },
    drawOn(ctx) { ops.forEach((op) => op(ctx)); },
    toCanvas(width, height, bg) {
      // 2배 해상도로 그리되, 아이폰 캔버스 한도(약 1,600만 픽셀)를 넘지 않게
      const scale = Math.min(2, Math.sqrt(16e6 / (width * height)));
      const cv = document.createElement('canvas');
      cv.width = Math.round(width * scale); cv.height = Math.round(height * scale);
      const ctx = cv.getContext('2d');
      ctx.scale(scale, scale);
      ctx.fillStyle = bg; ctx.fillRect(0, 0, width, height);
      this.drawOn(ctx);
      return cv;
    },
  };
}

function pageUrl() { return location.protocol.startsWith('http') ? location.host + location.pathname : ''; }
function inputLabel(h, w) { return [h != null ? `${h}cm` : '', w != null ? `${w}kg` : ''].filter(Boolean).join(' · '); }

function drawResultCard(S, c, h, w, x, y, cw) {
  const ink = css('--ink'), muted = css('--muted'), deep = css('--deep');
  const rec = recommend(c, h, w, state.cat);
  const setBg = S.slot();
  const ip = 16, B = 60, tx = x + ip + B + 14, tw = cw - (tx - x) - ip;

  const s = rec.none ? null : c.sizes[rec.idx];
  const upS = rec.none || rec.up == null ? null : c.sizes[rec.up];
  const alt = [s && s.alt, upS ? `여유 있게 ${upS.label}` : ''].filter(Boolean).join(' · ');
  const altLines = alt ? wrapText(alt, 13, 500, tw) : [];
  const textH = 22 + 4 + 22 + (altLines.length ? 6 + altLines.length * 18 : 0);
  const topH = Math.max(B, textH);

  // 사이즈 동그라미
  const cx = x + ip + B / 2, cy = y + ip + topH / 2;
  if (rec.none) {
    S.circle(cx, cy, B / 2, css('--c3'));
    S.text('정보', cx, cy - 8, 12, 600, muted, 'center');
    S.text('없음', cx, cy + 8, 12, 600, muted, 'center');
  } else {
    S.circle(cx, cy, B / 2, rec.over ? css('--c3') : css('--c1'), rec.over ? css('--c2') : null);
    S.text(s.label, cx, cy, s.label.length > 2 ? 17 : 21, 800, rec.over ? deep : '#fff', 'center', B - 10);
  }

  // 브랜드 · 라인 · 대체 표기
  let ty = y + ip + (topH - textH) / 2;
  S.text(c.brand, tx, ty + 11, 17, 800, ink, 'left', tw);
  ty += 26;
  S.pill(c.title, tx, ty, 12, deep, css('--c3'));
  ty += 22;
  if (altLines.length) {
    ty += 6;
    altLines.forEach((l) => { S.text(l, tx, ty + 9, 13, 500, muted); ty += 18; });
  }

  let by = y + ip + topH + 12;
  const iw = cw - ip * 2;
  if (rec.none) {
    const key = c.sizes[0].h ? '키' : '몸무게';
    wrapText(`이 브랜드 표는 ${key} 기준이에요. ${key}를 입력해 주세요.`, 12, 400, iw).forEach((l) => {
      S.text(l, x + ip, by + 9, 12, 400, muted); by += 18;
    });
  } else {
    const whyLines = wrapText(rec.why, 13, 400, iw - 24);
    const boxH = whyLines.length * 19 + 16;
    S.box(x + ip, by, iw, boxH, 12, css('--bg'));
    whyLines.forEach((l, i) => S.text(l, x + ip + 12, by + 8 + i * 19 + 9.5, 13, 400, muted));
    by += boxH;
    if (rec.flags.length) {
      by += 10;
      let bx = x + ip;
      rec.flags.forEach(([k, t]) => {
        const bw = textWidth(t, 12, 500) + 20;
        if (bx > x + ip && bx + bw > x + ip + iw) { bx = x + ip; by += 28; }
        const [bg, fg] = BADGE_COLORS[k];
        bx += S.pill(t, bx, by, 12, css(fg), bg) + 6;
      });
      by += 22;
    }
  }
  const ch = by + ip - y;
  setBg(cardBg(x, y, cw, ch));
  return y + ch;
}

// 카드 배경 (흰 바탕 + 테두리)
function cardBg(x, y, w, h) {
  const bg = newSheet();
  bg.box(x, y, w, h, 18, css('--paper'), css('--line'));
  return (ctx) => bg.drawOn(ctx);
}

  return y;
}

  let y = 38;
  S.text(`${SHOP.name} 사이즈 가이드`, W / 2, y, 14, 700, css('--deep'), 'center'); y += 34;
  S.text('우리 아이 추천 사이즈', W / 2, y, 26, 800, css('--ink'), 'center'); y += 32;
  S.text(`${inputLabel(h, w)} · ${catName}`, W / 2, y, 15, 600, css('--deep'), 'center'); y += 28;
  charts.forEach((c) => { y = drawResultCard(S, c, h, w, P, y, W - P * 2) + 12; });
  y = drawFooter(S, W, y + 16);
  return S.toCanvas(W, y + 14, css('--bg'));
}

function drawChart(c) {
  const { h, w } = readInput();
  const rec = h != null || w != null ? recommend(c, h, w, state.cat) : null;
  const pick = rec && !rec.none ? rec : null;
  const ink = css('--ink'), muted = css('--muted'), deep = css('--deep');
  const W = 480, P = 24, iw = W - P * 2, S = newSheet();

  let y = 34;
  S.text(`${SHOP.name} 사이즈 가이드`, P, y, 13, 700, deep); y += 30;
  const bw = Math.min(textWidth(c.brand, 22, 800), iw);
  S.text(c.brand, P, y, 22, 800, ink, 'left', iw);
  const tagW = textWidth(c.title, 12, 500) + 20;
  if (P + bw + 10 + tagW <= W - P) {
    S.pill(c.title, P + bw + 10, y - 11, 12, deep, css('--c3'));
  } else {
    y += 26; S.pill(c.title, P, y - 11, 12, deep, css('--c3'));
  }
  y += 34;

  // 표
  const cols = [0.24, 0.24, 0.24, 0.28].map((f) => f * iw);
  const colX = cols.map((_, i) => P + cols.slice(0, i).reduce((a, b) => a + b, 0) + cols[i] / 2);
  ['사이즈', '키(cm)', '몸무게(kg)', '연령'].forEach((t, i) => S.text(t, colX[i], y, 12, 500, muted, 'center'));
  y += 18;
  c.sizes.forEach((s, i) => {
    const isPick = pick && i === pick.idx, isUp = pick && i === pick.up;
    const rh = s.alt ? 46 : 38;
    S.box(P, y, iw, rh, 10, isPick ? css('--c2') : isUp ? css('--c3') : css('--bg'));
    const color = isPick ? deep : ink, weight = isPick ? 700 : 400;
    const mid = y + rh / 2;
    if (s.alt) {
      S.text(s.label, colX[0], mid - 8, 14, 700, color, 'center', cols[0] - 8);
      S.text(s.alt, colX[0], mid + 10, 11, 400, muted, 'center', cols[0] - 8);
    } else {
      S.text(s.label, colX[0], mid, 14, 700, color, 'center', cols[0] - 8);
    }
    [fmtRange(s.h), fmtRange(s.w), s.age || '-'].forEach((t, j) =>
      S.text(t, colX[j + 1], mid, 13, weight, color, 'center', cols[j + 1] - 8));
    y += rh + 4;
  });

  if (c.note) {
    y += 8;
    wrapText(c.note, 12, 400, iw).forEach((l) => { S.text(l, P, y + 9, 12, 400, muted); y += 18; });
  }
  if (pick) {
    y += 8;
    S.text(`${inputLabel(h, w)} 기준 추천 사이즈를 표시했어요`, P, y + 9, 12, 600, deep, 'left', iw);
    y += 18;
  }
  y = drawFooter(S, W, y + 22);
  return S.toCanvas(W, y + 10, css('--bg'));
}

function fileName(...parts) {
  return parts.join('_').replace(/\s*·\s*/g, '_').replace(/[\s\\/:*?"<>|()&]+/g, '_').replace(/_+/g, '_').replace(/_$/, '') + '.png';
}

let viewUrl = null;
function showImage(canvas, name) {
  canvas.toBlob((blob) => {
    if (viewUrl) URL.revokeObjectURL(viewUrl);
    viewUrl = URL.createObjectURL(blob);
    $('imgviewImg').src = viewUrl;
    $('imgviewDl').href = viewUrl;
    $('imgviewDl').download = name;
    $('imgview').hidden = false;
  }, 'image/png');
}

async function saveImage(kind, i) {
  try { // 웹폰트가 다 받아진 뒤에 그려야 글꼴이 맞게 나와요
    await Promise.all([400, 500, 600, 700, 800].map((wt) => document.fonts.load(`${wt} 16px Pretendard`, '가A1')));
  } catch (e) { /* 글꼴을 못 받아도 기본 글꼴로 저장 */ }
  if (kind === 'result') {
    const { h, w } = readInput();
    showImage(drawResult(), fileName(SHOP.name, '추천사이즈', inputLabel(h, w).replace(/ · /g, '_')));
  } else {
    const c = BRANDS[i];
    showImage(drawChart(c), fileName(SHOP.name, c.brand, c.title));
  }
}

function bindChips(id, key, after) {
  $(id).addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    [...$(id).children].forEach((x) => x.classList.toggle('on', x === b));
    state[key] = b.dataset.v; if (after) after(); render();
  });
}

renderShop();
renderBrandChips();
bindChips('cat', 'cat');
bindChips('lineFilter', 'line');
bindChips('brandChips', 'brand');
document.querySelectorAll('[data-step]').forEach((b) => b.addEventListener('click', () => {
  const input = $(b.dataset.step);
  const base = input.value === '' ? parseFloat(input.placeholder) : parseFloat(input.value);
  input.value = Math.max(0, Math.round((base + parseFloat(b.dataset.d)) * 10) / 10);
  render();
}));
$('h').addEventListener('input', render);
$('w').addEventListener('input', render);
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-save]'); if (!b) return;
  saveImage(b.dataset.save, Number(b.dataset.i));
});
$('imgviewClose').addEventListener('click', () => { $('imgview').hidden = true; });
$('imgview').addEventListener('click', (e) => { if (e.target === $('imgview')) $('imgview').hidden = true; });
render();
</script>
</body>
